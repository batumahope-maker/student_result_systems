<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-student">

<div class="card">
  <h2>Student Login</h2>
  <input type="text" id="code" placeholder="Student Code">
  <input type="text" id="name" placeholder="Student Name">
  <button onclick="login()">Login</button>
  <p id="err"></p>
</div>

<script>
function login(){
  const students = JSON.parse(localStorage.getItem("students")) || [];
  const code = document.getElementById("code").value.trim();
  const name = document.getElementById("name").value.trim().toLowerCase();

  const student = students.find(
    s => s.StudentCode == code && s.Name.toLowerCase() === name
  );

  if(!student){
    document.getElementById("err").innerText = "Invalid login details";
    return;
  }

  localStorage.setItem("student", JSON.stringify(student));
  location.href = "student-report.html";
}
</script>
</body>
</html>
